services:
  app:
    build: .docker
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/.git/
    working_dir: /app
    user: 1000:1000
